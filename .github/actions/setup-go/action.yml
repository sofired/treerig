name: Set up Go with a cache of its own
description: >
  actions/setup-go, with its cache replaced by one keyed by this job's name.
  setup-go's own key names only the platform, the Go version and go.mod, so
  every Linux job shares one entry, and whichever finishes first saves it for
  all of them: the release-snapshot job's builds, without the race detector or
  cgo, were restored into the jobs that need both. With a key per job, each
  job restores what it built last time. A matrix whose entries build
  differently on one platform passes cache-suffix, so each entry keeps its own.
inputs:
  cache-suffix:
    description: >
      Appended to the cache key after the job's name, for matrix entries that
      share a platform but build differently (the docker job's -race and no-cgo
      legs). Start it with a hyphen.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false

    - id: paths
      shell: bash
      run: |
        echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        # staticcheck keeps its own cache beside Go's, in the user cache directory.
        echo "staticcheck=$(dirname "$(go env GOCACHE)")/staticcheck" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
          ${{ steps.paths.outputs.staticcheck }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}${{ inputs.cache-suffix }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}${{ inputs.cache-suffix }}-
