name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and CLI tests
        run: pnpm test

      # Real Git and real locks everywhere; the Docker suites skip themselves
      # where no daemon answers (the macOS runners). On Linux they are required
      # to run: that leg is the proof that the router and the Compose runtime
      # work against a real Docker Engine, and a skipped proof must not read
      # as a pass.
      - name: Integration tests
        env:
          BERTH_TEST_REQUIRE_DOCKER: ${{ runner.os == 'Linux' && '1' || '' }}
        run: pnpm test:integration
