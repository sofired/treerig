name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Format
        run: test -z "$(gofmt -l cmd internal)"

      # Both builds: the integration tests are files the default build never compiles.
      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -tags integration ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o dist/treerig ./cmd/treerig

      # Real git, real processes and signals (flock inheritance, group kills,
      # death by the re-raised signal), and the streams contract
      # (TestStreamsContract, against a binary it builds itself). The macOS
      # leg is the one that proves the lock layer on APFS and the kern.proc
      # sysctls. Tests that need a real Docker daemon run in the docker job,
      # alongside this one.
      - name: Integration tests
        env:
          TREERIG_TEST_SKIP_DOCKER: '1'
        run: go test -race -count=1 -tags integration ./...

      # Releases are built with CGO_ENABLED=0, but every run above links cgo:
      # the race detector needs it, and os/user pulls it in on Linux. cgo
      # changes how a Go program runs. Its extra thread, for one, stops Go's
      # deadlock check from ever firing, which once hid a macOS-only failure.
      - name: Tests without cgo, as released
        env:
          CGO_ENABLED: '0'
          TREERIG_TEST_SKIP_DOCKER: '1'
        run: |
          go test -count=1 ./...
          go test -count=1 -tags integration ./...

  # The integration suite against the runner's real Docker daemon, in its own
  # job so it runs in parallel with the rest. It runs the whole suite, not a
  # list of packages, so a Docker test added anywhere is picked up; the tests
  # that don't need Docker run again here, which costs a few seconds.
  #
  # The job is a matrix of leg x shard, ten jobs, each on its own runner and
  # Docker daemon, so it takes as long as the slowest of them. The legs are
  # -race and no cgo, as released. internal/commands is most of the time, in
  # serial Docker tests (about 500s of 760s under -race), then internal/router
  # and internal/cli, so the shards are:
  #
  #   commands 1/3, 2/3   slow internal/commands tests named in the script
  #   commands 3/3        every other test there, selected by -skip of those
  #                       names, so a new test lands here without an edit
  #   router + cli        the packages named in the script
  #   other packages      `go list ./...` minus those and internal/commands,
  #                       computed at run time, so a new package is picked up
  #
  # .github/scripts/commands-shards.sh holds the names and builds each shard's
  # go test command. Its `check` fails the shard, before any Docker work,
  # unless every top-level test in internal/commands is selected by exactly one
  # commands shard and every package is in exactly one shard. The script lives
  # beside the workflow, not under packaging/, which is release tooling.
  # Measured 2026-10 on 8 CPUs, seconds of test time per shard, -race / no cgo:
  # commands 1/3 about 144 / 189, 2/3 about 171 / 189, 3/3 about 182 / 189,
  # router + cli about 145 / less, other packages about 115 / less. Setup, the
  # build and the cold image pulls add 1 to 2 minutes to each, and Docker
  # timings vary 30% between runs. Before sharding, the race leg took 10.6
  # minutes.
  #
  # fail-fast is off so one shard failing still reports the others.
  docker:
    name: >-
      docker ubuntu-latest (${{ matrix.leg }},
      ${{ matrix.shard == 'rest' && 'other packages' || matrix.shard == 'slow' && 'router + cli' || format('commands {0}/3', matrix.shard) }})
    runs-on: ubuntu-latest
    # -timeout 20m stops a hung package. A commands shard is one package, so
    # 25m leaves room for one hang and setup. The package shards run several
    # packages, each with its own 20m, so 35m leaves room for one hang and the
    # rest.
    timeout-minutes: ${{ (matrix.shard == 'rest' || matrix.shard == 'slow') && 35 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        leg: [race, no cgo]
        shard: ['1', '2', '3', slow, rest]
        # cgo and race go together: -race needs cgo. Each leg and shard keeps
        # its own build cache, since the legs build different objects and the
        # shards build different test binaries.
        include:
          - leg: race
            cgo: '1'
            race: -race
            cache: -race
          # As in the go job: releases are built without cgo.
          - leg: no cgo
            cgo: '0'
            race: ''
            cache: -nocgo
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          cache-suffix: ${{ matrix.cache }}-${{ matrix.shard }}

      # Every top-level test in internal/commands runs in exactly one shard,
      # and every package in exactly one.
      # It starts no test, so it needs no Docker. It takes the leg's -race so
      # that it reuses the packages compiled for the run below.
      - name: Every commands test and package is in exactly one shard
        if: matrix.shard != 'rest' && matrix.shard != 'slow'
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: .github/scripts/commands-shards.sh check ${{ matrix.race }}

      - name: Integration tests against Docker
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          TREERIG_TEST_REQUIRE_DOCKER: '1'
        # -p 1: one package at a time. The Docker suites pick the router's
        # index and ping ports from a deterministic hash start, so packages
        # running in parallel collide. Shards run on separate runners, each
        # with a daemon of its own, so they don't. -timeout 20m: Go's default
        # of 10m per package is too tight on a slower machine, where
        # internal/commands takes about 12m whole. A timeout panic skips
        # t.Cleanup and leaks resources.
        # matrix.race is a constant from the matrix above, empty on the no-cgo leg.
        run: .github/scripts/commands-shards.sh run ${{ matrix.shard }} ${{ matrix.race }} -p 1 -timeout 20m -count=1 -tags integration

  # Everything the release builds, minus the publishing and the signing, which
  # need a tag and an OIDC token: GoReleaser's check, then a snapshot of the
  # four binaries, the archives, the source archive, the .deb/.rpm/.apk
  # packages and checksums.txt.
  # It also replaces a plain cross-compile of the four targets, since the
  # snapshot builds them the way a release does (CGO_ENABLED=0, trimpath).
  # packaging/verify-snapshot.sh then checks the artifacts, renders the tap
  # formula (dist/treerig.rb) the way the release's tap job does, and runs
  # install.sh against them. A real cosign then pins the snapshot (teardown
  # pin --release) with a throwaway key.
  release-snapshot:
    name: release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      - name: ShellCheck
        run: shellcheck -s sh install.sh packaging/completions.sh packaging/verify-snapshot.sh .github/scripts/commands-shards.sh

      # Installed once and put on PATH, so the reproducibility step below can
      # run it again; the action alone leaves no goreleaser on PATH.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true

      # The teardown pin flow below runs a real cosign against the snapshot.
      # Same installer commit and cosign version as release.yml; the version is
      # an input Dependabot does not move (docs/design/release.md).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: GoReleaser check
        run: goreleaser check

      - name: Snapshot build
        run: goreleaser release --snapshot --clean --skip=sign

      # The same commit builds to the same bytes (commit-dated, root-owned
      # files), so a published checksum can be checked by rebuilding. It runs
      # before the verify step, whose dist/treerig.rb a --clean rebuild would
      # delete.
      - name: The snapshot is reproducible
        run: |
          cp dist/checksums.txt "$RUNNER_TEMP/first-checksums.txt"
          goreleaser release --snapshot --clean --skip=sign
          diff "$RUNNER_TEMP/first-checksums.txt" dist/checksums.txt

      # install.sh's completion setup is checked against a real interactive zsh,
      # which the runner image may not carry; verify-snapshot.sh fails under CI
      # rather than skip that check.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Verify the artifacts, the tap formula and install.sh
        run: packaging/verify-snapshot.sh dist

      # teardown pin --release against the snapshot: the test signs a copy of
      # dist/checksums.txt with a throwaway key (no Rekor, no TSA, no network),
      # serves dist/ from a local TLS server and checks the pin against
      # checksums.txt and the built treerig. It only reads dist/, so the upload
      # below still sees the artifacts. TREERIG_REQUIRE_COSIGN makes a missing
      # cosign or snapshot a failure, not a skip. The log is then checked, so
      # that a -run pattern that matches nothing, or a test that skips for any
      # other reason, cannot pass: all four tests must report PASS
      # (docs/design/teardown.md, "CI"). pipefail, from shell: bash, keeps a
      # failing go test failing through the tee.
      - name: The snapshot pins with a real cosign
        shell: bash
        env:
          TREERIG_REQUIRE_COSIGN: '1'
        run: |
          version=$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' dist/metadata.json)
          test -n "$version"
          log="$RUNNER_TEMP/pin-tests.log"
          TREERIG_SNAPSHOT_DIST="$PWD/dist" TREERIG_SNAPSHOT_VERSION="$version" \
            go test -v -race -count=1 -run '^(TestTeardownPinSnapshot|TestTeardownPinSnapshotTampering|TestTeardownPinWithRealCosign|TestTeardownPinWithRealCosignAndNoTrustRoot)$' ./internal/commands/ 2>&1 | tee "$log"
          for name in TestTeardownPinSnapshot TestTeardownPinSnapshotTampering TestTeardownPinWithRealCosign TestTeardownPinWithRealCosignAndNoTrustRoot; do
            grep -q -- "^--- PASS: $name " "$log" || { echo "::error::$name did not report PASS"; exit 1; }
          done
          if grep -q -- '--- SKIP' "$log"; then
            echo "::error::a test skipped"
            exit 1
          fi

      # The snapshot's own treerig, built with CGO_ENABLED=0 and -trimpath as a
      # release is, is pinned into a scratch root and run through `worktree
      # remove`'s gate against an empty directory: it must print the pinned
      # binary's line, which only a successful exec through /proc/self/fd (or,
      # on macOS, the stored path) can. Nothing is removed. Like the step
      # above, it fails on a skip or a missing PASS.
      - name: The snapshot binary runs through the removal gate
        shell: bash
        run: |
          version=$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' dist/metadata.json)
          test -n "$version"
          log="$RUNNER_TEMP/gate-test.log"
          TREERIG_SNAPSHOT_DIST="$PWD/dist" TREERIG_SNAPSHOT_VERSION="$version" \
            go test -v -race -count=1 -tags integration -run '^TestSnapshotBinaryThroughTheGate$' ./internal/cli/ 2>&1 | tee "$log"
          grep -q -- '^--- PASS: TestSnapshotBinaryThroughTheGate ' "$log" || { echo "::error::TestSnapshotBinaryThroughTheGate did not report PASS"; exit 1; }
          if grep -q -- '--- SKIP' "$log"; then
            echo "::error::a test skipped"
            exit 1
          fi

      # Reviewers can install a pull request's build, and the latest main
      # build stays available without waiting for a tag.
      - uses: actions/upload-artifact@v7
        with:
          name: treerig-snapshot
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
            dist/treerig.rb
          retention-days: 14
          if-no-files-found: error
