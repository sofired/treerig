name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l cmd internal)"

      # Both builds: the integration tests are files the default build never compiles.
      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -tags integration ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o dist/berth ./cmd/berth

      # Real git, real processes and signals (flock inheritance, group kills,
      # death by the re-raised signal), and the streams contract
      # (TestStreamsContract, against a binary it builds itself). The macOS
      # leg is the one that proves the lock layer on APFS and the kern.proc
      # sysctls. Tests that need a real Docker daemon run in the docker job,
      # alongside this one.
      - name: Integration tests
        env:
          BERTH_TEST_SKIP_DOCKER: '1'
        run: go test -race -count=1 -tags integration ./...

      # Releases are built with CGO_ENABLED=0, but every run above links cgo:
      # the race detector needs it, and os/user pulls it in on Linux. cgo
      # changes how a Go program runs. Its extra thread, for one, stops Go's
      # deadlock check from ever firing, which once hid a macOS-only failure.
      - name: Tests without cgo, as released
        env:
          CGO_ENABLED: '0'
          BERTH_TEST_SKIP_DOCKER: '1'
        run: |
          go test -count=1 ./...
          go test -count=1 -tags integration ./...

  # The integration suite against the runner's real Docker daemon, in its own
  # job so it runs in parallel with the rest. It runs the whole suite, not a
  # list of packages, so a Docker test added anywhere is picked up; the tests
  # that don't need Docker run again here, which costs a few seconds.
  docker:
    name: docker ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Integration tests against Docker
        env:
          BERTH_TEST_REQUIRE_DOCKER: '1'
        run: go test -race -count=1 -tags integration ./...

      # As in the go job: releases are built without cgo.
      - name: Integration tests against Docker without cgo, as released
        env:
          CGO_ENABLED: '0'
          BERTH_TEST_REQUIRE_DOCKER: '1'
        run: go test -count=1 -tags integration ./...

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # linux/darwin x amd64/arm64: the same four targets release.yml
      # builds for every push to main. release.yml does not run on a pull
      # request, so this job stays here to catch a cross-compile break
      # before it merges, built the same way (CGO_ENABLED=0; releases never
      # link cgo) but without release.yml's version stamping or checksums,
      # neither of which matter to a build that is discarded when the job ends.
      - name: Build every target
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "building ${goos}/${goarch}"
            GOOS="${goos}" GOARCH="${goarch}" go build -o "dist/berth-${goos}-${goarch}" ./cmd/berth
          done
