# The Compose file lives in a subdirectory of the config root. Relative paths
# in it must resolve against this directory, as they do with `docker compose -f`.
services:
  web:
    image: busybox:1.37.0
    command: ["sh", "-c", "exec httpd -f -p 8080 -h /www"]
    expose: ["8080"]
    volumes:
      - type: bind
        source: ./www
        target: /www
        read_only: true
        bind:
          create_host_path: false
