# Fixture for the real-Docker tests. Two tiny HTTP servers, one named
# volume, and environment references that prove the BERTH_* injection.
services:
  api:
    image: busybox:1.37.0
    command: ["sh", "-c", "mkdir -p /www && echo 'hello from api' > /www/index.html && exec httpd -f -p 8080 -h /www"]
    expose: ["8080"]
    environment:
      SLUG: ${BERTH_SLUG}
      HOST: ${BERTH_HOST}
      WORKTREE_HOME: ${BERTH_WORKTREE_HOME}
    volumes:
      - data:/data
  worker:
    image: busybox:1.37.0
    command: ["sh", "-c", "mkdir -p /www && echo 'hello from worker' > /www/index.html && exec httpd -f -p 9090 -h /www"]
    expose: ["9090"]
volumes:
  data: {}
