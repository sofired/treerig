#:schema https://raw.githubusercontent.com/sofired/treerig/main/schema/treerig.schema.json
# treerig.toml — commit this at the root of your repository.
#
# The line above points TOML editors (Even Better TOML/Taplo, or any editor
# that takes a JSON Schema for TOML) at treerig's JSON Schema, for completion,
# hover text and unknown-key warnings. It tracks main; `treerig config schema >
# treerig.schema.json` pins the schema to the version you have installed, and
# then `#:schema ./treerig.schema.json` uses that file.
#
# The file is plain TOML 1.0, with no multi-line inline tables, so Taplo and
# Python's tomllib read it too.
#
# Everything the tool needs to know about your project lives here. Everything
# it needs to *do* for your project lives in the hook executables you point at.
# Unknown keys are rejected so a typo cannot silently disable a feature.

[project]
# Lower-case letters, digits, and hyphens.
name = "acme"

# Every worktree is routed as <slug>.<domain>, where the slug is derived from
# the branch name: feature/login becomes feature-login.acme.localhost.
# A shared parent domain lets password managers reuse a local credential
# across every environment.
domain = "acme.localhost"

# Optional, and you almost certainly do not want it. Sets the Docker label
# namespace used to mark resources as owned. The only reason to set this is to
# adopt resources created by a predecessor tool that used a different one.
# label-namespace = "dev.acme"

[compose]
# Relative to this file. Paths inside the Compose file itself (build contexts,
# bind mounts, env_file) and its `.env` resolve against the Compose file's own
# directory — docker/ here — exactly as with `docker compose -f docker/compose.yaml`.
# ${TREERIG_ROOT} still names the directory of *this* file, for paths that must
# be repository-relative. COMPOSE_* keys in that .env are honoured, except the
# project name and file list, which the tool sets.
file = "docker/compose.yaml"

# ---------------------------------------------------------------------------
# Services. Each [service.<name>] table names a Compose service and says how
# it is reached. The name is lower-case letters, digits and hyphens.
# Services not listed here still run; they just are not routed or indexed.

[service.api]
# subdomain = ""        # empty (the default) routes at the worktree host root

[service.api.index]     # presence on the shared checkout index; omit to hide
label   = "API"
purpose = "REST surface"

[service.mail]
subdomain = "mail"      # mail.<slug>.acme.localhost

[service.mail.index]
label   = "Mailpit"
purpose = "Captured email"

[service.docs]
subdomain = "docs"
path      = "/latest"   # routes only this prefix; several services may share a host with different paths
port      = 4000        # container port to route to; defaults to the first port the service exposes

# ---------------------------------------------------------------------------
# Shared services. Some services are wasteful once per worktree: an email
# catcher, an object-store emulator. A shared service runs once per
# repository, from a Compose file of its own, and is connected to each
# worktree whose services use it, under its name as a network alias
# (mailpit:1025 from a container). The first `up` that needs it starts it.
# It may not build an image or bind-mount a path inside a worktree.

[shared]
file = "docker/compose.shared.yaml"   # relative to this file

[shared.service.mailpit]               # a service in that file; also the alias
port    = 8025                         # optional: the web UI's container port, routed at mailpit.shared.<domain>
ports   = [1025]                       # optional: more container ports, for processes on the host
# Each of those is published on a pinned 127.0.0.1 port: a hook gets it as
# TREERIG_SHARED_ADDR_MAILPIT_1025, and the web UI's URL as TREERIG_SHARED_URL_MAILPIT.
used-by = ["api"]                      # this worktree's Compose services that use it

# ---------------------------------------------------------------------------
# Hooks. Each is an executable — any language. A command that starts with "."
# or contains "/" is resolved relative to this file; anything else is looked up
# on PATH. Each runs with this directory as its working directory and is handed
# the TREERIG_* environment described in docs/hooks.md. Exit zero means success.

[hooks]
# Services are up and healthy; nothing has been seeded. Migrations go here.
prepare = "./scripts/migrate.sh"

# Runs only after `prepare` exits zero.
seed = "./scripts/seed.py"

# Run by `treerig doctor` for a registered worktree: is this environment healthy?
# Its output goes to stderr, since doctor's stdout is its report.
verify = "./scripts/check.sh"

# Run by `treerig backup [dir]` and `treerig restore <dir>`, each with the bundle
# directory as its first argument: backup writes the worktree's data into it,
# restore loads it back. Both need the worktree's services running.
backup  = "./scripts/backup.sh"
restore = "./scripts/restore.sh"

# Optional time limits, one per hook, keyed by its name. A hook with no entry
# has no limit. Past its limit a hook is stopped, with its whole process group
# on the host (not work it handed to a container), and the command that ran it
# (`up`, `doctor`, `backup` or `restore`) fails it as timed out (exit 124). A
# duration such as "30s", "10m" or "1h30m", at most 24h. Size one for the
# slowest healthy run.
[hooks.timeout]
prepare = "30m"
verify  = "2m"

# ---------------------------------------------------------------------------
# Commands. Named tasks for `treerig run <name> [-- args...]`: on-demand work
# that is not part of coming up, such as `terraform plan` and `apply` against
# this worktree's services. Resolved like hooks, run from this directory with
# the same TREERIG_* environment plus TREERIG_COMMAND, on your terminal, so they
# can prompt and answer Ctrl-C. Names are lower-case letters, digits and hyphens.

[commands]
# The command line on its own: locked, and killed 10s after it is stopped.
plan = "./scripts/keycloak.sh plan"

[commands.apply]
command    = "./scripts/keycloak.sh apply"
# lock = true          # the default: hold this worktree's lock while it runs, so
#                      # `up`, `down` and a second `run` wait. false skips only the
#                      # lock, and is trusted, not enforced.
kill-after = "60s"     # how long its process group has to exit once stopped, before
#                      # it is killed; at most 1h. Size it for the command's own
#                      # graceful stop.
