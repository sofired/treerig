# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Builds, packages and publishes a treerig release. `goreleaser release --clean`
# runs on a v* tag (.github/workflows/release.yml); `goreleaser release
# --snapshot --clean --skip=sign` runs on every pull request and on every push
# to main (the release-snapshot job in .github/workflows/go.yml) and publishes
# nothing; signing needs the release job's OIDC token, so a snapshot skips it.
# CONTRIBUTING.md says how to cut a release, and docs/design/release.md pins
# the names and identities that install.sh and verifiers depend on.
#
# Homebrew is not configured here: the tap's formula builds from the source
# archive below, so its bump is the release workflow's homebrew-tap job, the
# template is packaging/homebrew/treerig.rb, and packaging/verify-snapshot.sh
# renders a snapshot's formula into dist/treerig.rb.
version: 2

project_name: treerig

before:
  hooks:
    - sh packaging/completions.sh

builds:
  - id: treerig
    main: ./cmd/treerig
    binary: treerig
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # The same ldflags target the version rules in release.yml validate.
    ldflags:
      - -s -w -X github.com/sofired/treerig/internal/brand.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Every file in an archive or package carries the commit's date and root
# ownership, so two builds of one commit produce the same bytes.
archives:
  - id: treerig
    ids: [treerig]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # install.sh depends on the file name above and on `treerig` sitting at the
    # archive's root (docs/design/release.md).
    wrap_in_directory: false
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &archive_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info: *archive_info
      - src: README.md
        info: *archive_info
      - src: completions/*
        dst: completions
        strip_parent: true
        info: *archive_info

# The tag's source, which Homebrew builds from. Unlike GitHub's generated
# tarball, it is listed in checksums.txt, so it is signed and attested.
source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}"
  format: tar.gz
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

nfpms:
  - id: treerig
    ids: [treerig]
    package_name: treerig
    # The package's own build time (rpm, deb) and directory dates.
    mtime: "{{ .CommitDate }}"
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Southern Fired Software, LLC
    homepage: https://github.com/sofired/treerig
    maintainer: Southern Fired Software, LLC <packages@sofired.io>
    description: |-
      Give every Git worktree a durable identity, an isolated home, and a routed URL.
      Needs Git, Docker and Docker Compose at run time.
    license: Apache-2.0
    section: utils
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    recommends: [git]
    contents:
      - src: completions/treerig.bash
        dst: /usr/share/bash-completion/completions/treerig
        file_info: &package_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: completions/_treerig
        dst: /usr/share/zsh/site-functions/_treerig
        file_info: *package_info
      - src: completions/treerig.fish
        dst: /usr/share/fish/vendor_completions.d/treerig.fish
        file_info: *package_info
      - src: completions/trig.bash
        dst: /usr/share/bash-completion/completions/trig
        file_info: *package_info
      - src: completions/_trig
        dst: /usr/share/zsh/site-functions/_trig
        file_info: *package_info
      - src: completions/trig.fish
        dst: /usr/share/fish/vendor_completions.d/trig.fish
        file_info: *package_info
      # The short alias, a relative symlink in the same directory. It is
      # shipped unconditionally: a package manager refuses to overwrite a file
      # another package owns, so a clash fails the install loudly rather than
      # replacing anything (docs/design/release.md, "The trig alias").
      - src: treerig
        dst: /usr/bin/trig
        type: symlink
        file_info:
          owner: root
          group: root
          mode: 0777
          mtime: "{{ .CommitDate }}"
      # Debian wants a machine-readable copyright file that points at the
      # system's copy of the license text.
      - src: packaging/debian/copyright
        dst: /usr/share/doc/treerig/copyright
        packager: deb
        file_info: *package_info
      - src: LICENSE
        dst: /usr/share/licenses/treerig/LICENSE
        type: license
        packager: rpm
        file_info: *package_info
      - src: LICENSE
        dst: /usr/share/licenses/treerig/LICENSE
        packager: apk
        file_info: *package_info
      - src: NOTICE
        dst: /usr/share/doc/treerig/NOTICE
        file_info: *package_info

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless: the Sigstore certificate is bound to the release workflow's identity
# through the job's OIDC token (id-token: write), so there is no key to store.
# The bundle carries the signature, the certificate and the transparency-log
# entry, which is all `cosign verify-blob --bundle` needs.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum

# What `goreleaser release --snapshot` stamps in place of a tag: not a version
# anyone could mistake for a release's.
snapshot:
  version_template: "0.0.0-dev+{{ slice .FullCommit 0 12 }}"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - '^test(\(.+\))?!?:'
      - '^ci(\(.+\))?!?:'
      - '^chore(\(.+\))?!?:'
      - '^style(\(.+\))?!?:'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 2
    - title: Other changes
      order: 999

release:
  name_template: "{{ .Tag }}"
  prerelease: auto
  # A re-run of the release job (after a failure past the upload) replaces the
  # assets of the release it already created instead of failing on them.
  replace_existing_artifacts: true
  footer: |
    Verify a download against `checksums.txt`, its Sigstore bundle and the
    build provenance attestation as
    [Verifying a download](https://github.com/sofired/treerig/blob/main/docs/install.md#verifying-a-download)
    describes.
